name: Axiom Search-First Windows Build

on:
  push:
    branches:
      - search-first-opening-simd
  pull_request:
    branches:
      - main

jobs:
  windows-release-avx2:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure MSVC Release AVX2
        run: cmake -S . -B build -DAXIOM_NATIVE_AVX2=ON

      - name: Build Release
        run: cmake --build build --config Release --parallel 2

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: AxiomChess-Windows-AVX2
          path: |
            build/Release/axiom-1.0.exe
          if-no-files-found: error

      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Perft
        shell: pwsh
        run: .\build\Release\axiom-1.0.exe --perft 4

      - name: Bench
        shell: pwsh
        run: .\build\Release\axiom-1.0.exe --bench
